# A single CI script with github workflow
name: Tests

on:
  workflow_dispatch:
  push:
    branches-ignore: ["gh-readonly-queue/**"]
  merge_group:
  pull_request:
    types: [labeled, opened] # opened is required to allow external contributors

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'run-workflow') || github.event_name == 'push' || github.event_name == 'merge_group'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    uses: qiboteam/workflows/.github/workflows/test.yml@uv
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      doctests: ${{ matrix.os == 'ubuntu-latest'}}
      uv-extras: "--no-dev --group tests --group docs --group analysis --all-extras"
    secrets: inherit
