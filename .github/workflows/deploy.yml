# A single CI script with github workflow
name: Build wheels and deploy

on:
  workflow_dispatch:
  push:
    branches-ignore: ["gh-readonly-queue/**"]
  merge_group:
  release:
    types:
      - published

jobs:
  build:
    uses: qiboteam/workflows/.github/workflows/wheels.yml@v3
    with:
      os: ubuntu-latest
      python-version: "3.12"
      publish: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    secrets: inherit
