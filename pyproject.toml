[project]
name = "qibo"
version = "0.3.5"
description = "A framework for quantum computing with hardware acceleration."
authors = [{ name = "The Qibo team" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0.0,<3.0.0",
  "scipy>=1.15.2,<2.0.0",
  "sympy>=1.13.1,<2.0.0",
  "networkx>=3.2.1,<4.0.0",
  "cma>=4.0.0,<5.0.0",
  "joblib>=1.4.2,<2.0.0",
  "optuna>=4.2.1,<5.0.0",
  "tabulate>=0.9.0,<1.0.0",
  "openqasm3[parser]>=1.0.1,<2.0.0",
]

[project.urls]
Homepage = "https://qibo.science/"
Repository = "https://github.com/qiboteam/qibo/"
Documentation = "https://qibo.science/docs/qibo/stable"

[project.optional-dependencies]
qinfo = ["stim>=1.15.0,<2.0.0"]
qulacs = ["qulacs>=0.6.4,<0.7.0; python_version < '3.13'"]
cudaq = ["qbraid[cudaq]>=0.10.0,<0.11.0"]
qir = ["qbraid[qir]>=0.10.0,<0.11.0"]

[dependency-groups]
dev = [
  "pdbpp>=0.10.3,<0.11.0",
  "ipython>=8.34.0,<9.0.0",
]
analysis = ["ruff>=0.16.5,<0.17.0"]
docs = [
  "sphinx>=6.1.3,<7.0.0",
  "furo>=2022.12.7,<2023.0.0",
  "recommonmark>=0.7.1,<0.8.0",
  "sphinxcontrib-bibtex>=2.5.0,<3.0.0",
  "sphinx-markdown-tables>=0.0.17,<0.0.18",
  "sphinx-copybutton>=0.5.2,<0.6.0",
  "nbsphinx>=0.8.12,<0.9.0",
  "qulacs>=0.6.4,<0.7.0; python_version < '3.13'",
  "seaborn>=0.13.2,<0.14.0",
  "ipykernel>=6.29.4,<7.0.0",
  "qibojit @ git+https://github.com/qiboteam/qibojit.git@ch",
]
tests = [
  "pytest>=7.2.1,<10.0.0",
  "pytest-cov>=4.0.0,<5.0.0",
  "matplotlib>=3.7.0,<4.0.0",
  "qibojit @ git+https://github.com/qiboteam/qibojit.git@ch",
  "stim>=1.15.0,<2.0.0",
  "qulacs>=0.6.4,<0.7.0; python_version < '3.13'",
  "qiskit>=2.2.3,<3.0.0",
  "qbraid[cudaq,qir]>=0.10.0,<0.11.0",
  "pygridsynth>=2.0.0,<3.0.0",
]
cuda11 = [
  "cupy-cuda11x>=13.1.0,<14.0.0",
  "cuquantum-python-cu11>=24.1.0,<25.0.0",
  "qibojit @ git+https://github.com/qiboteam/qibojit.git@ch",
]
cuda12 = [
  "cupy-cuda12x>=13.1.0,<14.0.0",
  "cuquantum-python-cu12>=24.1.0,<25.0.0",
  "qibojit @ git+https://github.com/qiboteam/qibojit.git@ch",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = ["qibo @ file://${PROJECT_ROOT}"]

[tool.uv.sources]
qibo = { workspace = true }

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
lint-warnings = """
  ruff check --exit-zero \
  --select F,E,W,C90,N,UP,BLE,FBT,B,A,C4,T10,EM,EXE,ISC,ICN,LOG,G,INP,PIE,T20,PT,Q,RSE,\
           RET,SLF,SLOT,SIM,TC,INT,ARG,PTH,ERA,NPY,PERF,RUF
"""
docs = "make -C doc html"
docs-clean = "make -C doc clean"
test-docs = "make -C doc doctest"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["BLE001"] # TODO: BLE001 is about except Exception, fix properly

[tool.ruff.lint.per-file-ignores]
# Optional-dependency tests: the import is commented out and the module is
# skipped, so the names are only referenced inside skipped code.
"tests/test_backends_qibotn.py" = ["F821"]
"tests/test_cirq.py" = ["F821"]
"tests/test_models_circuit_cudaq.py" = ["F821"]
"tests/test_models_circuit_qasm_cirq.py" = ["F821"]
# Intentional bare expressions: attribute access inside ``pytest.raises``
# (to trigger the exception) and smoke-test attribute reads.
"tests/test_backends_global.py" = ["B018"]
"tests/test_gates_gates.py" = ["B018"]
"tests/test_hamiltonians_symbolic.py" = ["B018"]
"tests/test_models_circuit_execution.py" = ["B018"]
"tests/test_models_distcircuit.py" = ["B018"]
"tests/test_models_evolution.py" = ["B018"]
# Standalone illustrative example scripts and notebooks: shebangs are
# intentional (scripts meant to be run), notebooks produce cell-level F821
# false positives, and the rest are pedagogical code not part of the library.
"examples/**" = [
  "B018",
  "B019",
  "E722",
  "EXE001",
  "F821",
  "PLW0127",
  "RUF059",
  "S102",
  "S110",
  "SIM113",
  "SIM115",
  "TRY002",
  "UP031",
]

[tool.pytest.ini_options]
testpaths = ['tests/']
filterwarnings = ['ignore::RuntimeWarning']
addopts = [
  '--cov=qibo',
  '--cov-append',
  '--cov-report=xml',
  '--cov-report=html',
  '--durations=60',
]

[tool.coverage.run]
omit=[
  "src/qibo/models/qcnn.py",
  "src/qibo/models/variational.py",
  "src/qibo/models/utils.py",
  "src/qibo/optimizers.py",
  "src/qibo/solvers.py",
]
